# file.encoding=COMPAT ＝ 使用系統原生編碼（例如繁中 Windows 的 CP950）。
# 原因：java.exe 讀測試 worker 的 @argfile 一律用原生編碼；若 Gradle daemon
# 改用 UTF-8 寫 argfile，含非 ASCII 字元的專案路徑會被讀壞，單元測試會全部
# ClassNotFoundException。專案路徑是純 ASCII 的話改不改都行，但改了沒有好處。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=COMPAT
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true
kotlin.code.style=official
